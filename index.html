.slogo .smeta{font-family:var(--px);font-size:12px;color:#fff;margin-top:14px;opacity:.9;text-shadow:1px 1px 0 #2b1d10}
.splash .strip{position:relative;line-height:0;padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(transparent 70%,#8b5a2b 70%)}
[data-theme="dark"] .splash .strip{background:linear-gradient(transparent 70%,#3a2c22 70%)}
.splash .strip svg{width:100%;height:auto;aspect-ratio:160/46}
.splash .strip .day,.splash .strip .night{display:none!important}

/* dungeon */
.jump{display:grid!important;grid-template-columns:repeat(3,1fr)}
.dgbtn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:3px solid #120e18;padding:12px 14px;margin:16px 0 4px;color:#fff;background:linear-gradient(#4a3a63,#241c33);box-shadow:0 5px 0 rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.15)}
.dgbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.dgbtn .dgic{flex:0 0 64px;height:64px;display:flex;align-items:center;justify-content:center;background:#1a1424;border:2px solid #120e18}
.dgbtn b{font-family:var(--px);font-size:21px;display:block;color:#ffd84a;text-shadow:2px 2px 0 #000}
.dgbtn span{font-size:12.5px;display:block;opacity:.9;line-height:1.5}
.dgbtn .rec{font-family:var(--px);color:#9fd0f0;margin-top:2px}
.dgbtn .go{font-family:var(--px);font-size:22px;color:#ffd84a;animation:pblink 1s steps(1) infinite}
.dgtop .floor{font-family:var(--px);font-weight:700;background:#241c33;color:#ffd84a;padding:1px 8px;border:2px solid #120e18}
.arena{position:relative;height:270px;border:3px solid #120e18;margin:10px 0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:26px;
 background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.45)),
 repeating-linear-gradient(0deg,#231d2c 0 3px,transparent 3px 24px),
 repeating-linear-gradient(90deg,#231d2c 0 3px,transparent 3px 48px),#3e3550;box-shadow:0 6px 0 var(--edge2)}
.arena.boss{background:linear-gradient(rgba(120,0,0,.1),rgba(0,0,0,.5)),repeating-linear-gradient(0deg,#2c1618 0 3px,transparent 3px 24px),repeating-linear-gradient(90deg,#2c1618 0 3px,transparent 3px 48px),#52282b}
.arena:after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:repeating-linear-gradient(90deg,#2a2433 0 30px,#332b3e 30px 60px);border-top:3px solid #120e18}
.arena .torch{position:absolute;top:96px;animation:flick .5s steps(2) infinite}
.arena .torch svg{width:22px;height:22px}
.arena .torch.l{left:14px}.arena .torch.r{right:14px;animation-delay:.25s}
@keyframes flick{50%{transform:scaleY(.8) translateY(2px);opacity:.8}}
.mname{position:absolute;top:10px;left:0;right:0;text-align:center;font-family:var(--px);font-weight:700;color:#fff;font-size:16px;text-shadow:2px 2px 0 #000}
.bosstag{background:#c8452f;color:#fff;padding:0 6px;margin-right:6px;border:2px solid #000;font-size:12px;animation:pblink .8s steps(1) infinite}
.hpbar{position:absolute;top:38px;left:18%;right:18%;height:16px;border:3px solid #000;background:#3a1416}
.hpbar i{display:block;height:100%;background:linear-gradient(#ff7a6b 0 35%,#e0453a 35%);transition:width .45s steps(9)}
.hpbar span{position:absolute;inset:0;text-align:center;font-family:var(--px);font-size:10px;line-height:10px;color:#fff;text-shadow:1px 1px 0 #000}
.mon{position:relative;z-index:1}
.mon svg{animation:idle 1.2s steps(2) infinite}
@keyframes idle{50%{transform:translateY(-4px)}}
.mon.hit{animation:hit .4s steps(4)}
.mon.crit{animation:crit .55s steps(6)}
@keyframes hit{0%,50%{filter:brightness(3.5) saturate(0);transform:translateX(-8px)}25%,75%{transform:translateX(8px)}100%{filter:none;transform:none}}
@keyframes crit{0%,40%{filter:brightness(4) saturate(0);transform:scale(1.15) translateX(-10px)}20%,60%{transform:scale(1.1) translateX(10px)}100%{filter:none;transform:none}}
.mon.dead,.mon.gone{animation:die .7s steps(7) forwards}
.mon.gone{animation-duration:0s}
@keyframes die{0%{opacity:1}20%{opacity:0}40%{opacity:1}60%{opacity:0;transform:translateY(8px)}80%{opacity:.6}100%{opacity:0;transform:translateY(24px) scaleY(.4)}}
.mon.lunge{animation:lunge .45s steps(4)}
@keyframes lunge{40%{transform:scale(1.3) translateY(14px)}100%{transform:none}}
.flash{position:absolute;inset:0;background:#e0453a;opacity:0;pointer-events:none;z-index:3}
.flash.on{animation:fl .45s steps(3)}
@keyframes fl{0%{opacity:.55}100%{opacity:0}}
.fly{position:absolute;top:44%;transform:translateX(-50%);z-index:4;font-family:var(--px);font-weight:700;white-space:nowrap;pointer-events:none;display:flex;align-items:center;gap:4px;animation:flyup 1.2s steps(12) forwards}
.fly.dmg{font-size:32px;color:#fff;text-shadow:3px 0 0 #000,-3px 0 0 #000,0 3px 0 #000,0 -3px 0 #000}
.fly.dmg.crit{font-size:44px;color:#ffd84a}
.fly.dmg.me{color:#ff7a6b;font-size:26px;top:60%}
.fly.tag{top:30%;font-size:17px;color:#ffd84a;background:rgba(0,0,0,.6);padding:1px 8px;border:2px solid #000}
@keyframes flyup{0%{opacity:0;margin-top:10px}12%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-50px}}
.combo{position:absolute;left:10px;top:66px;z-index:2;font-family:var(--px);font-weight:700;font-size:15px;color:#fff;background:#e07a2c;border:2px solid #000;padding:1px 8px;transform:rotate(-6deg)}
.combo.pop{animation:cpop .35s steps(3)}
@keyframes cpop{0%{transform:rotate(-6deg) scale(1.8)}100%{transform:rotate(-6deg) scale(1)}}
.killbox{position:absolute;inset:0;z-index:5;background:rgba(10,6,16,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-family:var(--px)}
.killbox.late{animation:kb .3s .8s both steps(3)}
@keyframes kb{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.killbox b{font-size:30px;color:#ffd84a;text-shadow:3px 3px 0 #000}
.killbox span{font-size:14px;display:flex;align-items:center;gap:6px}
.killbox .rw{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);padding:2px 10px}
.dgstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 10px}
.dgstats div{border:2px solid var(--edge);background:var(--bg2);padding:8px 2px}
.dgstats b{display:block;font-family:var(--px);font-size:20px}
.dgstats span{font-size:12px;color:var(--fg2)}

/* clean lists */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 18px}
.chips.two{grid-template-columns:1fr 1fr}
.chips button{font-family:var(--px);font-size:13.5px;padding:7px 4px;border:2px solid var(--edge);background:var(--bg);white-space:nowrap}
.chips button:active{background:var(--bg2)}
.lhead{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-family:var(--px)}
.lhead b{font-size:16px;background:var(--bg);border:2px solid var(--edge);padding:1px 10px}
.lhead .muted{font-family:"Noto Sans KR",sans-serif;font-size:13px;background:var(--bg);padding:0 6px}
.linkbtn{font-family:var(--px);font-size:13px;border:2px solid var(--edge);background:var(--bg);padding:2px 8px}
.list{border:3px solid var(--edge);background:var(--bg);box-shadow:0 4px 0 var(--edge2)}
.lrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:2px dashed var(--line);padding:11px 14px;min-height:54px}
.lrow:first-child{border-top:0}
.lrow:active{background:var(--bg2)}
.lrow .lt{display:block;font-family:var(--px);font-size:15px;font-weight:700}
.lrow .ls{display:block;font-size:12.5px;color:var(--fg2)}
.lrow .arr{font-family:var(--px);font-size:18px;color:var(--fg3)}
.urow.sel{background:var(--bg2)}
.urow .ck{flex:0 0 22px;height:22px;border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:13px}
.urow.sel .ck{background:var(--acc);color:var(--accfg);border-color:var(--accedge)}
.urow .th{flex:0 0 30px;line-height:0}
.urow .ut{display:block;font-size:15px;font-weight:700;line-height:1.4;word-break:keep-all}
.urow .un{font-family:var(--px);color:var(--fg3);font-weight:400;margin-right:6px}
.urow .mbar{display:block;height:5px;background:var(--bg3);margin-top:5px}
.urow .mbar i{display:block;height:100%;background:var(--acc)}
.urow .pct{font-family:var(--px);font-size:13px;color:var(--fg2);min-width:34px;text-align:right}
.rng{margin:10px 0 0;background:var(--bg);display:inline-block;padding:0 6px}
.seg{display:flex;border:2px solid var(--edge);background:var(--bg)}
.seg button{font-family:var(--px);font-size:12.5px;border:0;border-left:2px solid var(--edge);background:none;padding:2px 8px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--acc);color:var(--accfg)}
.dgbtn{margin:10px 0 4px!important;padding:10px 14px!important}
.dgbtn .dgic{flex:0 0 54px!important;height:54px!important}

/* stage map */
.smap{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 0;padding:18px 4px 8px;margin-top:6px;border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge2);
 background:repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 16px,transparent 16px 32px),repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 16px,transparent 16px 32px),#7fc35a}
[data-theme="dark"] .smap{background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 16px,transparent 16px 32px),repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 16px,transparent 16px 32px),#2c3346}
.snode{position:relative;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.snode:before{content:"";position:absolute;z-index:0;background:repeating-linear-gradient(90deg,#e9d9a6 0 8px,transparent 8px 14px)}
.snode.r:before{left:50%;width:100%;top:32px;height:8px}
.snode.l:before{right:50%;width:100%;top:32px;height:8px}
.snode.d:before{left:calc(50% - 4px);width:8px;top:36px;height:calc(100% + 26px);background:repeating-linear-gradient(0deg,#e9d9a6 0 8px,transparent 8px 14px)}
[data-theme="dark"] .snode:before{filter:brightness(.6)}
.snode .tile{position:relative;z-index:1;width:72px;height:72px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge2)}
.snode:active .tile{transform:translateY(3px);box-shadow:0 2px 0 var(--edge2)}
.snode.sel .tile{border-color:var(--accedge);background:var(--bg2);box-shadow:0 5px 0 var(--accedge),0 0 0 4px var(--acc);animation:bob 1.2s steps(2) infinite}
.snode .num{position:absolute;left:-9px;top:-11px;font-family:var(--px);font-weight:700;font-size:13px;background:var(--edge);color:var(--bg);padding:0 5px;line-height:1.5}
.snode .flag{position:absolute;right:-9px;top:-11px;font-size:12px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:var(--acc);color:var(--accfg);border:2px solid var(--accedge)}
.snode .hero{position:absolute;right:-12px;bottom:-6px;line-height:0}
.snode .nm{position:relative;z-index:1;font-family:var(--px);font-size:12.5px;background:var(--bg);border:2px solid var(--edge);padding:0 6px;margin-top:5px;white-space:nowrap}
.snode.sel .nm{background:var(--acc);color:var(--accfg);border-color:var(--accedge)}
.snode .stars{position:relative;z-index:1;display:flex;gap:1px;background:var(--bg);padding:2px 4px;border:2px solid var(--edge)}
.startbar{position:sticky;bottom:calc(30px + env(safe-area-inset-bottom));z-index:6;margin-top:16px}

.snode.r:before,.snode.l:before{top:30px!important;height:12px!important;background:linear-gradient(#b48a52 0 3px,transparent 3px 9px,#b48a52 9px) !important;
 box-shadow:none}
.snode.d:before{left:calc(50% - 6px)!important;width:12px!important;background:linear-gradient(90deg,#b48a52 0 3px,transparent 3px 9px,#b48a52 9px) !important}
/* 밤: 광산 레일 */
[data-theme="dark"] .snode:before{filter:none!important}
[data-theme="dark"] .snode.r:before,[data-theme="dark"] .snode.l:before{height:14px!important;top:29px!important;background:
 linear-gradient(transparent 2px,#b9bec8 2px 4px,transparent 4px 10px,#b9bec8 10px 12px,transparent 12px),
 repeating-linear-gradient(90deg,#6b4a2b 0 4px,transparent 4px 9px) !important}
[data-theme="dark"] .snode.d:before{width:14px!important;left:calc(50% - 7px)!important;background:
 linear-gradient(90deg,transparent 2px,#b9bec8 2px 4px,transparent 4px 10px,#b9bec8 10px 12px,transparent 12px),
 repeating-linear-gradient(0deg,#6b4a2b 0 4px,transparent 4px 9px) !important}
[data-theme="dark"] .snode .tile{background:#2e3139;border-color:#0c0d11}
[data-theme="dark"] .snode.sel .tile{background:#24323a}
.smap .torchp{position:absolute;line-height:0;animation:flick .5s steps(2) infinite;pointer-events:none}
.smap .torchp:after{content:"";position:absolute;left:50%;top:40%;width:90px;height:90px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,180,80,.28),transparent 65%)}
.smap{position:relative}
.smap .torchp{display:none}
[data-theme="dark"] .smap .torchp{display:block}

/* survival */
.sv{padding-top:12px}
.svtop{display:flex;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--edge);padding:5px 8px;font-family:var(--px);font-size:13px}
.svhp{display:flex;gap:0;flex-wrap:nowrap}
.svhp svg{width:13px;height:11px}
.svday{white-space:nowrap}
.svtip{margin:8px 0;font-size:13.5px;background:var(--bg);border:2px solid var(--edge);padding:5px 10px;font-family:var(--px)}
.svtip:before{content:"▶ ";color:var(--acc)}
.svwrap{position:relative;border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge2);line-height:0;background:#000}
.svwrap canvas{width:100%;image-rendering:pixelated;touch-action:manipulation;cursor:pointer}
.svq{position:absolute;inset:0;z-index:5;background:rgba(5,6,12,.6);display:flex;align-items:flex-start;justify-content:center;padding:8px;overflow:auto;line-height:1.6}
.svq[hidden]{display:none}
.svqin{background:var(--bg);border:3px solid var(--edge);padding:12px 14px;width:100%;box-shadow:0 5px 0 rgba(0,0,0,.4)}
.svqh{display:flex;align-items:center;gap:10px;font-family:var(--px)}
.svqh img{width:36px;height:36px;image-rendering:pixelated}
.svqh b{font-size:18px}
.svqh{flex-wrap:wrap}
.svqh span{flex-basis:100%;font-size:12px;color:var(--fg2);font-family:'Noto Sans KR',sans-serif}
.svqh.danger b{color:var(--nofg)}
.svq .q{font-size:16.5px;margin:6px 0 8px}
.svq .opt{padding:9px 11px;font-size:15px;margin:7px 0}
.svpad{display:grid;grid-template-columns:repeat(4,1fr) 1.3fr;gap:8px;margin-top:12px}
.svb{font-family:var(--px);font-size:22px;min-height:54px;border:3px solid var(--edge);background:var(--bg);box-shadow:0 4px 0 var(--edge2);user-select:none;-webkit-user-select:none}
.svb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge2)}
.svb.mode{font-size:16px;font-weight:700;background:var(--bg2)}
.svb.mode.on{background:var(--acc);color:var(--accfg);border-color:var(--accedge)}
.svtools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.svtool{display:flex;align-items:center;gap:4px;font-family:var(--px);font-size:12px;background:var(--bg);border:2px solid var(--edge);padding:2px 8px}
.svtool img{width:20px;height:20px;image-rendering:pixelated}
.svtool i{font-style:normal;color:var(--fg3);width:20px;text-align:center}
.svbar{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding:6px;background:var(--bg);border:3px solid var(--edge);scrollbar-width:thin}
.svit{flex:0 0 auto;position:relative;width:62px;border:2px solid var(--line);background:var(--bg2);padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center}
.svit img{width:30px;height:30px;image-rendering:pixelated}
.svit b{position:absolute;right:3px;top:22px;font-family:var(--px);font-size:12px;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
.svit span{font-size:10.5px;white-space:nowrap;margin-top:2px}
.svit.on{border-color:var(--accedge);background:var(--acc);color:var(--accfg)}
.svit.mat{opacity:.85}
.svcraft{max-height:80vh;overflow:auto}
.svrl{margin-top:10px}
.svr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px dashed var(--line)}
.svr img{width:32px;height:32px;image-rendering:pixelated;flex:0 0 32px}
.svr b{display:block;font-size:14.5px}
.svr span{display:block;font-size:12px;color:var(--fg2)}
.svr.off img{opacity:.45}
.svhelp p{font-size:14px;margin:8px 0;line-height:1.6}
.svhelp b{font-family:var(--px);background:var(--bg2);border:2px solid var(--line);padding:0 6px;margin-right:4px}
.modebtn.svcard{background:linear-gradient(var(--bg),var(--bg2))}
/* title */
body.onTitle header{box-shadow:none}
.title{padding-top:14px}
.sceneWrap{position:relative;border:3px solid var(--edge);box-shadow:0 6px 0 var(--edge2);overflow:hidden;margin-top:6px}
.scene{width:100%;height:auto;aspect-ratio:160/84}
.scene .night{display:none}
[data-theme="dark"] .scene .night{display:inline}
[data-theme="dark"] .scene .day{display:none}
.scene .hill{fill:#7fc35a}
[data-theme="dark"] .scene .hill{fill:#2c3346}
.scene .dirt{fill:#8b5a2b} .scene .dirt2{fill:#6e4520}
[data-theme="dark"] .scene .dirt{fill:#3a2c22} [data-theme="dark"] .scene .dirt2{fill:#2a2019}
.scene .ghost{fill:#2b1d10;opacity:.28}
[data-theme="dark"] .scene .ghost{fill:#fff;opacity:.22}
.scene .drift{animation:drift 26s steps(52) infinite alternate}
@keyframes drift{from{transform:translateX(-12px)}to{transform:translateX(40px)}}
.scene .tw{animation:tw 1.6s steps(2) infinite}
@keyframes tw{50%{opacity:.15}}
.scene .walker{animation:walk 16s linear infinite}
@keyframes walk{from{transform:translateX(-10px)}to{transform:translateX(166px)}}
.scene .fb{animation:fa .5s steps(1) infinite}
.scene .fa{animation:fa .5s steps(1) infinite reverse}
@keyframes fa{0%{opacity:1}50%{opacity:0}}
.logo{position:absolute;left:0;right:0;top:9%;text-align:center;pointer-events:none}
.logo .l1{display:inline-block;font-family:var(--px);font-size:13px;color:#fff;background:rgba(43,29,16,.55);padding:1px 8px;letter-spacing:1px}
.logo .l2{font-family:var(--px);font-weight:700;font-size:clamp(34px,10.5vw,58px);line-height:1.15;color:#fff;letter-spacing:1px;
 text-shadow:3px 0 0 var(--edge),-3px 0 0 var(--edge),0 3px 0 var(--edge),0 -3px 0 var(--edge),3px 3px 0 var(--edge),-3px 3px 0 var(--edge),3px -3px 0 var(--edge),-3px -3px 0 var(--edge),0 7px 0 #c8452f,3px 7px 0 #c8452f,-3px 7px 0 #c8452f;
 animation:bob 2.4s steps(2) infinite}
[data-theme="dark"] .logo .l2{text-shadow:3px 0 0 #0c0d11,-3px 0 0 #0c0d11,0 3px 0 #0c0d11,0 -3px 0 #0c0d11,3px 3px 0 #0c0d11,-3px 3px 0 #0c0d11,3px -3px 0 #0c0d11,-3px -3px 0 #0c0d11,0 7px 0 #b27cff,3px 7px 0 #b27cff,-3px 7px 0 #b27cff}
@keyframes bob{50%{transform:translateY(-3px)}}
.logo .l3{display:inline-block;margin-top:6px;font-family:var(--px);font-size:11.5px;color:#fff;background:rgba(43,29,16,.55);padding:1px 8px}
.pcard{display:flex;gap:14px;align-items:center}
.lvbig{font-family:var(--px);font-weight:700;font-size:30px;line-height:1;background:var(--acc);color:var(--accfg);border:3px solid var(--accedge);padding:8px 10px}
.pstats{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-family:var(--px);font-size:13px}
.btn.start{width:100%;min-height:64px;font-size:22px;flex-direction:column;gap:0;margin-top:6px;line-height:1.3}
.btn.start small{font-size:12px;font-weight:400;opacity:.85}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{box-shadow:0 4px 0 var(--accedge),inset 0 0 0 3px rgba(255,255,255,.55)}}
.jump{display:flex;gap:8px;margin:0 0 14px}
.jump button{flex:1;font-family:var(--px);font-size:14px;padding:9px 4px;border:3px solid var(--edge);background:var(--bg);box-shadow:0 4px 0 var(--edge2);white-space:nowrap}
.jump button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge2)}
.tsec{font-family:var(--px);font-weight:700;font-size:16px;margin:22px 0 2px;display:inline-flex;gap:8px;align-items:center;background:var(--bg);border:2px solid var(--edge);padding:2px 10px;box-shadow:3px 3px 0 var(--edge2)}
.qcount{background:var(--acc2);color:#fff;padding:0 6px;font-size:12px;border:2px solid var(--edge)}
.modebtn.cur{outline:3px solid var(--acc);outline-offset:-8px}
.dq{padding:6px 14px}
.dqi{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:2px dashed var(--line)}
.dqi:first-child{border-top:0}
.dqi b{font-size:14.5px}
.dqi .ck{flex:0 0 24px;height:24px;border:3px solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--bg)}
.dqi.ok .ck{background:var(--acc);color:var(--accfg);border-color:var(--accedge)}
.dqi.ok b{text-decoration:line-through;text-decoration-thickness:2px;color:var(--fg2)}
.dqi .rw{font-family:var(--px);font-size:12px;color:var(--fg2)}
.dqi .pn{font-family:var(--px);font-size:12.5px;min-width:38px;text-align:right}
.dqi.chest{opacity:.65}
.dqi.chest.ok{opacity:1}
.dqi.chest.ok b{text-decoration:none;color:var(--fg)}
.tfoot{text-align:center;font-family:var(--px);font-size:12px;color:var(--fg2);margin-top:18px}

header,.clouds,.groundbar{display:none!important}.wrap{max-width:none;padding:0}
.sv3{position:fixed;inset:0;z-index:20;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

.s3top{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:4px;pointer-events:none}
.s3hp{display:flex;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.s3day,.s3tip{font-family:var(--px);color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;pointer-events:none}
.s3day{font-size:13px}
.s3tip{position:absolute;left:10px;right:110px;top:calc(62px + env(safe-area-inset-top));font-size:12.5px;line-height:1.35}

.s3right{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px}

.s3b:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.s3joy{position:absolute;left:22px;bottom:calc(92px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.35);touch-action:none}

.s3act.big{width:92px;height:92px;right:16px;bottom:10px;font-size:17px;background:rgba(224,122,44,.7)}
.s3act#s3place{right:90px;bottom:10px}.s3act#s3jump{right:16px;bottom:10px}
.s3act.down{transform:translateY(3px);filter:brightness(1.3)}
.s3bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;overflow-x:auto;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(0,0,0,.5);scrollbar-width:none}

.s3it img{width:26px;height:26px;image-rendering:pixelated}.s3it b{position:absolute;right:3px;top:1px;font-size:12px;text-shadow:1px 1px 0 #000}.s3it span{font-size:10px;margin-top:1px;white-space:nowrap}
.s3it.on{border-color:#fff;background:rgba(120,120,130,.8);box-shadow:0 0 0 2px #000 inset}.s3it.mat{opacity:.7}

const UNITS = [
{
id:'u12', no:12, title:'8·15 광복을 맞이하다', short:'8·15 광복',
notes:[
 {h:"1) 조선 건국 준비 위원회(건준)", l:["배경 | 일본 패망 직전, 총독부 ↔ **여운형** 교섭","> 총독부 요구: 일본인 안전","> 여운형 요구: 정치범 석방, 식량 확보, 정치 활동 자유","조직 | **여운형**·**안재홍** ← **조선 건국 동맹** 바탕","활동 | 전국 지부 → **치안 유지** + 행정","참여 | 좌·우 망라, **친일파 제외**","미군 진주 직전 | **조선 인민 공화국** 선포, 지부 → **인민 위원회**","> 좌익 중심화 → 민족주의 세력 일부 이탈"]},
 {h:"2) 미군정 (38도선 이남)", l:["방식 | **직접 통치** + **현상 유지**","> 총독부 관료·경찰 그대로 근무","인정 X | 조선 인민 공화국, 임시 정부 → **인민 위원회 해산**","경제 | 공장 운영 인정 X + 화폐 남발 → **인플레이션**","식량 | 수집·배급 통제 → **대구** 항쟁(1946)"]},

function tone(f,d,type,vol,to,delay){const t0=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);g.gain.setValueAtTime(vol||.05,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.03)}
function sfx(n){
 if(S.mute)return;
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const seq=(fs,d,type,v)=>fs.forEach((f,i)=>tone(f,d,type,v,null,i*d*.9));
  switch(n){
   case 'ok':seq([660,990],.07,'square',.04);break;
   case 'hit':tone(520,.09,'square',.06,180);tone(90,.08,'triangle',.08,50,.02);break;
   case 'crit':seq([784,1047,1568],.06,'square',.05);tone(120,.15,'sawtooth',.05,40,.05);break;
   case 'wrong':tone(180,.28,'sawtooth',.05,70);break;
   case 'block':seq([300,300],.06,'triangle',.07);break;
   case 'kill':seq([523,659,784,1047],.08,'square',.05);break;
   case 'boss':seq([523,659,784,1047,1319,1568],.09,'square',.05);break;
   case 'step':tone(160,.07,'triangle',.08,120);tone(140,.07,'triangle',.08,100,.12);break;
   case 'bossin':seq([110,104,98,87],.16,'sawtooth',.05);break;
   case 'heal':seq([523,784,1047],.07,'triangle',.07);break;

  }
 }catch(e){}
}

function svPickQ(kind){
 const uids=selU();const types=kind==='chest'?['sa','src']:kind==='mon'?['mc','sa','bl']:['mc','src','sa','bl'];
 let pool=qsOf(uids,types);if(!pool.length)pool=qsOf(uids,['mc']);return pool[Math.random()*pool.length|0];
}
function svAsk(kind,what,cb,ambush){
 const q=svPickQ(kind);if(!q){cb(true);return}
 const it={q,input:'',res:null};if(q.type==='mc'){const ds=shuffle(q.ds);ds.splice(Math.random()*4|0,0,q.ans);it.opts=ds}
 svQ={it,cb};svPause();
 const box=$('#svq');box.hidden=false;
 const head=kind==='mon'?`<div class="svqh danger">${pixSVG(MON[what].px,MON[what].pal,40)}<b>${ambush?'몬스터 습격!':'몬스터 공격!'}</b><span>맞히면 처치 · 틀리면 하트 -${swordDmg()}</span></div>`
  :kind==='chest'?`<div class="svqh">${CHEST}<b>보물 상자</b><span>맞히면 보물 3개</span></div>`
  :`<div class="svqh"><img src="${texURL(what)}"><b>${SVB[what].nm}</b><span>${kind==='blk'?'3번째 블록! 맞히면 획득 · 틀리면 못 얻음':'맞히면 획득 · 틀리면 돌이 됨'}</span></div>`;
 const draw=()=>{
  let body='';if(q.src)body+=`<div class="srcbox">${esc(q.src)}</div>`;
  body+=q.type==='bl'?`<div class="muted">${esc(q.head)}</div><div class="q" style="font-weight:500">${esc(q.q).replace('（　　　）','<span class="blank">?</span>')}</div>`:`<div class="q">${esc(q.q)}</div>`;
  if(q.type==='mc')body+=it.opts.map((o,i)=>{let c='';if(it.res){if(o===q.ans)c='ok';else if(o===it.input)c='no'}return `<button class="opt ${c}" data-i="${i}" ${it.res?'disabled':''}><span class="n">${i+1}</span><span>${esc(o)}</span></button>`}).join('');
  else{body+=`<input class="inp" id="svans" placeholder="답 입력" autocomplete="off" value="${esc(it.input)}" ${it.res?'disabled':''}>`;if(!it.res)body+=`<div class="row end" style="margin-top:10px"><button class="btn" id="svskip">모르겠어</button><button class="btn pri" id="svsub">확인</button></div>`}
  if(it.res){body+=fbHTML(it);body+=`<div class="row end">${!it.res.ok&&q.type!=='mc'?'<button class="btn" id="svovr">내 답이 맞아요</button>':''}<button class="btn pri" id="svok">계속</button></div>`}
  box.innerHTML=`<div class="svqin">${head}<div class="row" style="gap:6px;margin-top:8px"><span class="badge">${UM[q.uid].no}단원 · ${UM[q.uid].short}</span></div>${body}</div>`;
  const fin=ok=>{it.res=Object.assign(it.res||{},{ok});if(ok)delete S.wrong[q.id];else S.wrong[q.id]=1;onAnswer(q,ok);save();draw()};
  if(q.type==='mc'&&!it.res)box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{it.input=it.opts[+b.dataset.i];it.res={};fin(it.input===q.ans);sfx(it.res.ok?'ok':'wrong')});
  const a=$('#svans');if(a&&!it.res){a.oninput=()=>{it.input=a.value};a.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('#svsub').click()}};setTimeout(()=>{try{a.focus({preventScroll:true})}catch(e){}},30)}
  const sb=$('#svsub');if(sb)sb.onclick=async()=>{it.input=a.value.trim();if(!it.input)return;sb.disabled=true;sb.textContent='채점 중…';const r=await gradeText(q,it.input);it.res={fb:r.fb,ai:r.ai};fin(r.ok);sfx(r.ok?'ok':'wrong')};
  const sk=$('#svskip');if(sk)sk.onclick=()=>{it.res={};fin(false)};
  const ov=$('#svovr');if(ov)ov.onclick=()=>{it.res.over=true;fin(true)};
  const k=$('#svok');if(k)k.onclick=()=>{box.hidden=true;box.innerHTML='';const c=svQ.cb,ok=it.res.ok;svQ=null;c(ok)};
 };
 draw();
}

function renderQuiz(app){
 if(run&&run.kind==='quiz')return renderRun(app);

 $('#dgStart').onclick=startDG;

/* ---------- quiz session ---------- */
function startQuiz(lv,ids){
 const uids=selU();
 let pool=ids?ids.map(i=>BANK[i]).filter(Boolean):qsOf(uids,LV[lv].types);
 pool=shuffle(pool);
 const n=S.mode==='essay'?(S.ecount||5):(S.qcount||10);
 if(!ids&&n&&pool.length>n){
  if(lv==='mix'){ // 섞어서: 유형별로 고르게
   const by={};pool.forEach(q=>{const k=kindOf(q);(by[k]=by[k]||[]).push(q)});const ks=Object.keys(by);const out=[];let i=0;
   while(out.length<n&&ks.some(k=>by[k].length)){const k=ks[i++%ks.length];if(by[k].length)out.push(by[k].pop())}
   pool=shuffle(out);
  }else pool=pool.slice(0,n);
 }
 // 객관식 정답 위치 고르게
 const mcs=pool.filter(q=>q.type==='mc');let pos=[];while(pos.length<mcs.length)pos=pos.concat(shuffle([0,1,2,3]));pos=shuffle(pos.slice(0,mcs.length));
 const items=pool.map(q=>{const it={q,res:null,input:''};if(q.type==='mc'){const p=pos.shift();const ds=shuffle(q.ds);ds.splice(p,0,q.ans);it.opts=ds}return it});
 run={kind:'quiz',lv,items,pos:0,done:false,hearts:5,lost:0,xp0:S.game.xp};
 renderRun($('#app'));window.scrollTo(0,0);
}
function renderRun(app){
 const r=run;
 if(!r.items.length){app.innerHTML=`<div class="empty">이 범위에 문제가 없어.<br><br><button class="btn" id="bk">돌아가기</button></div>`;$('#bk').onclick=()=>{run=null;render()};return}
 if(r.done)return renderResult(app);
 const it=r.items[r.pos],q=it.q;const u=UM[q.uid];
 const kind=kindOf(q);const label={mc:'객관식',src:'사료',sa:'단답형',es:'서술형',bl:'빈칸'}[kind];
 let body='';
 if(q.src)body+=`<div class="srcbox">${esc(q.src)}</div>`;
 if(q.type==='bl')body+=`<div class="muted" style="margin-top:6px">${esc(q.head)}</div><div class="q" style="font-weight:500">${esc(q.q).replace('（　　　）','<span class="blank">?</span>')}</div>`;
 else body+=`<div class="q">${esc(q.q)}</div>`;
 if(q.type==='mc'){
  body+=it.opts.map((o,i)=>{let c='';if(it.res){if(o===q.ans)c='ok';else if(o===it.input)c='no'}
   return `<button class="opt ${c}" data-i="${i}" ${it.res?'disabled':''}><span class="n">${i+1}</span><span>${esc(o)}</span></button>`}).join('');
 }else{
  const ta=q.type==='es';
  body+=ta?`<textarea class="inp" id="ans" placeholder="답을 문장으로 써 봐" ${it.res?'disabled':''}>${esc(it.input)}</textarea>`
   :`<input class="inp" id="ans" placeholder="답 입력" autocomplete="off" value="${esc(it.input)}" ${it.res?'disabled':''}>`;
  if(!it.res)body+=`<div class="row end" style="margin-top:12px"><button class="btn" id="skip">모르겠어</button><button class="btn pri" id="sub">제출</button></div>`;
 }
 if(it.res)body+=fbHTML(it);
 if(it.res)body+=`<div class="row end" style="margin-top:6px">${it.res.ok?'':(q.type!=='mc'?'<button class="btn" id="ovr">내 답이 맞아요</button>':'')}<button class="btn pri" id="nxt">${r.pos===r.items.length-1?'결과 보기':'다음 →'}</button></div>`;
 app.innerHTML=`<div class="qhead"><button class="btn sm" id="quit">그만</button>${heartsHTML(r.hearts)}<div class="prog"><i style="width:${(r.pos+(it.res?1:0))/r.items.length*100}%"></i></div><span>${r.pos+1}/${r.items.length}</span></div>
 <div class="qbox ${it.res&&!it.res.ok&&it.fresh?'shake':''}"><div class="row" style="gap:6px"><span class="badge">${u.no}단원 · ${u.short}</span><span class="badge">${label}</span>${S.wrong[q.id]?'<span class="badge">오답노트</span>':''}</div>${body}</div>`;
 it.fresh=false;
 $('#quit').onclick=()=>{if(r.items.some(x=>x.res)){r.items=r.items.filter(x=>x.res);r.done=true;finish()}else{run=null}render()};
 if(q.type==='mc'&&!it.res)app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{it.input=it.opts[+b.dataset.i];grade(it,{ok:it.input===q.ans});renderRun(app)});
 const ans=$('#ans');
 if(ans&&!it.res){ans.oninput=()=>{it.input=ans.value};if(q.type!=='es'){ans.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('#sub').click()}}};setTimeout(()=>{try{ans.focus({preventScroll:true})}catch(e){}},30)}
 const sub=$('#sub');if(sub)sub.onclick=async()=>{it.input=ans.value.trim();if(!it.input)return;sub.disabled=true;sub.textContent='채점 중…';const res=await gradeText(q,it.input);grade(it,res);renderRun(app)};
 const sk=$('#skip');if(sk)sk.onclick=()=>{it.input='';grade(it,{ok:false,missing:q.type==='es'?q.keys.map(k=>k[0]):null});renderRun(app)};
 const ov=$('#ovr');if(ov)ov.onclick=()=>{it.res.ok=true;it.res.over=true;delete S.wrong[q.id];r.hearts=Math.min(5,r.hearts+1);r.lost=Math.max(0,r.lost-1);it.gain=XPV[kindOf(q)]||10;onAnswer(q,true,true);renderRun(app)};
 const nx=$('#nxt');if(nx)nx.onclick=()=>{if(r.pos===r.items.length-1){r.done=true;r.clear=true;finish()}else if(r.hearts<=0){r.done=true;r.over=true;finish()}else r.pos++;renderRun(app);window.scrollTo(0,0)};
}
function grade(it,res){it.res=res;it.fresh=true;sfx(res.ok?'ok':'wrong');const id=it.q.id;if(res.ok)delete S.wrong[id];else S.wrong[id]=1;
 if(run&&run.kind==='quiz'){if(res.ok)it.gain=XPV[kindOf(it.q)]||10;else{run.hearts=Math.max(0,run.hearts-1);run.lost++}}
 onAnswer(it.q,res.ok);save()}
function fbHTML(it){
 const q=it.q,res=it.res;let h=`<div class="fb ${res.ok?'ok':'no'}"><div class="v">${res.ok?(res.over?'정답으로 처리했어.':pick(['정답!','맞았어.','좋아, 정확해.'])):pick(['아쉬워.','다시 보자.','거의 다 왔어.'])}${res.ok&&it.gain?`<span class="gain">+${it.gain} XP · ${ICON.block.replace('width="14"','width="12"').replace('height="14"','height="12"')}+1</span>`:(!res.ok&&run&&run.kind==='quiz'?`<span class="gain">${ICON.heart}-1</span>`:'')}</div>`;
 if(q.type==='mc'){h+=`<div>정답: <b>${esc(q.ans)}</b></div>${q.ex?`<div style="margin-top:6px">${esc(q.ex)}</div>`:''}`}
 else if(q.type==='sa'||q.type==='bl'){h+=`<div>정답: <b>${esc(q.type==='bl'?q.acc[0]:prettyAns(q))}</b></div>`;if(q.type==='bl')h+=`<div class="lab">원래 문장</div><div>${esc(q.ex)}</div>`;else if(q.ex)h+=`<div style="margin-top:6px">${esc(q.ex)}</div>`;if(res.fb)h+=`<div class="lab">AI 한마디</div><div>${esc(res.fb)}</div>`}
 else{
  h+=`<div class="lab">모범 답안</div><div>${esc(q.model)}</div>`;
  if(res.missing&&res.missing.length)h+=`<div class="lab">빠진 핵심어</div><div>${res.missing.map(m=>`<span class="miss">${esc(m)}</span>`).join('')}</div>`;
  if(res.fb)h+=`<div class="lab">${res.ai?'AI 첨삭':'채점'}</div><div>${esc(res.fb)}</div>`;
 }
 return h+'</div>';
}
const pick=a=>a[Math.random()*a.length|0];
const CORPUS=U.map(u=>u.notes.map(s=>s.l.map(l=>plain(noteText(l))).join('\n')).join('\n')+'\n'+u.cards.map(c=>c.join('\n')).join('\n')+'\n'+u.match.map(m=>m.join('\n')).join('\n')).join('\n');
const PRETTY={};
function prettyAns(q){
 const a=q.acc[0];if(PRETTY[a])return PRETTY[a];
 let out=a.replace(/,/g,', ');
 if(!/[\s,]/.test(a)&&a.length>=4){try{const re=new RegExp(Array.from(a).map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s?'));const m=CORPUS.match(re);if(m)out=m[0]}catch(e){}}
 return PRETTY[a]=out;
}

/* ---------- grading ---------- */
function kwGrade(q,ans){
 const a=norm(ans);const hits=q.keys.map(g=>g.some(k=>a.includes(norm(k))));
 const n=hits.filter(Boolean).length,need=Math.ceil(q.keys.length*0.7);
 return {ok:n>=need,missing:q.keys.filter((g,i)=>!hits[i]).map(g=>g[0]),fb:`핵심어 ${q.keys.length}개 중 ${n}개 포함 (${need}개 이상이면 정답)`};
}
function saMatch(q,ans){const a=norm(ans);return q.acc.some(x=>{const n=norm(x);return a===n||(n.length>=3&&a.includes(n))})}
async function askAI(prompt){
 const out=await sample(prompt,{modelTier:'quick'});
 const t=(out&&out.text)||'';const m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error('no json');return JSON.parse(m[0]);
}
async function gradeText(q,ans){
 if(q.type==='sa'||q.type==='bl'){
  if(saMatch(q,ans))return {ok:true};
  if(sample){try{const j=await askAI(`너는 고등학교 한국사 단답형 채점자야. 학생 답이 정답과 같은 대상을 가리키면(띄어쓰기·약칭·사소한 표기 차이 허용) correct=true. 다른 대상이면 false.\n문제: ${q.type==='bl'?'빈칸 채우기 – '+q.q:q.q}\n정답: ${q.acc.join(' / ')}\n학생 답: ${ans}\nJSON만 출력: {"correct":true|false,"feedback":"한 문장(반말)"}`);return {ok:!!j.correct,fb:j.feedback,ai:true}}catch(e){}}
  return {ok:false};
 }
 const kw=kwGrade(q,ans);
 if(sample){
  try{const j=await askAI(`너는 고등학교 한국사 내신 서술형 채점자야. 학생 답이 모범 답안의 핵심 내용과 뜻이 맞으면 correct=true (표현이 달라도 됨). 핵심 요소가 빠졌거나 사실이 틀리면 false.\n문제: ${q.q}\n모범 답안: ${q.model}\n핵심 요소: ${q.keys.map(k=>k[0]).join(', ')}\n학생 답: ${ans}\nJSON만 출력: {"correct":true|false,"missing":["빠진 핵심 요소"],"feedback":"고칠 점 1~2문장, 고등학생에게 말하듯 반말"}`);
   return {ok:!!j.correct,missing:Array.isArray(j.missing)?j.missing:kw.missing,fb:j.feedback,ai:true}}catch(e){}
 }
 return kw;
}

/* ---------- result ---------- */
function finish(){
 const r=run;const by={};
 r.items.forEach(it=>{if(!it.res)return;const b=by[it.q.uid]=by[it.q.uid]||{c:0,t:0};b.t++;if(it.res.ok)b.c++});
 Object.entries(by).forEach(([uid,b])=>{const st=S.stats[uid];st.rate=Math.round(b.c/b.t*100);if(!r.counted){if(S.mode==='essay')st.essay++;else st.quiz++}});
 const tot=r.items.filter(x=>x.res).length,c=r.items.filter(x=>x.res&&x.res.ok).length;
 if(r.lv&&tot&&r.lv!=='wrong')S.lv[r.lv]=Math.round(c/tot*100);
 r.by=by;
 if(!r.counted){r.counted=true;
  if(r.clear&&r.hearts>0){r.bonus=r.hearts*5;gainXP(r.bonus);if(r.lost===0&&tot>=10)award('flaw')}
  Object.values(by).forEach(b=>{if(b.t>=5&&b.c===b.t)award('u100')});
  if(r.lv==='wrong'&&!Object.keys(S.wrong).length)award('wclr');
 }
 save();
}
function renderResult(app){
 const r=run;const done=r.items.filter(x=>x.res);const c=done.filter(x=>x.res.ok).length;
 const wrongIds=done.filter(x=>!x.res.ok).map(x=>x.q.id);
 const nextLv={mc:'sa',sa:'es',es:'mix'}[r.lv];
 const left=r.items.length-done.length;
 app.innerHTML=`<div class="card" style="text-align:center;margin-top:24px">
  ${r.over?`<div style="display:flex;justify-content:center">${ICON.skull}</div><h2 style="margin:6px 0 0;text-shadow:none">게임 오버</h2><div class="muted">하트를 다 잃었어 · 남은 문제 ${left}개</div>`:`<div style="display:flex;justify-content:center">${ICON.star}</div><h2 style="margin:6px 0 0;text-shadow:none">${r.clear?'클리어!':'중간 종료'}</h2>`}
  <div class="muted" style="margin-top:6px">${LV[r.lv]?LV[r.lv].n+' '+LV[r.lv].t:''}</div>
  <div class="score">${c} / ${done.length}</div><div class="muted">${done.length?Math.round(c/done.length*100):0}%</div>
  <div class="row" style="justify-content:center;margin-top:10px;font-family:var(--px);font-size:14px"><span class="stat">${ICON.gem}+${S.game.xp-r.xp0} XP</span>${r.bonus?`<span class="stat">(하트 보너스 +${r.bonus})</span>`:''}<span class="stat">${ICON.block}+${c}</span></div>
  ${r.over&&left?'<div class="row" style="margin-top:14px"><button class="btn pri grow" id="revive">하트 채우고 이어서 풀기</button></div>':''}</div>
 <h3>단원별 성취도</h3>${Object.entries(r.by||{}).map(([uid,b])=>`<div class="row" style="margin:6px 0"><span class="grow">${UM[uid].no}. ${UM[uid].short}</span><span class="muted">${b.c}/${b.t}</span><b style="width:52px;text-align:right">${Math.round(b.c/b.t*100)}%</b></div><div class="bar"><i style="width:${b.c/b.t*100}%"></i></div>`).join('')}
 <div class="row" style="margin-top:20px">${wrongIds.length?'<button class="btn grow" id="rw">틀린 문제만 다시</button>':''}<button class="btn grow" id="hub">${S.mode==='essay'?'처음으로':'퀴즈 목록'}</button></div>
 ${nextLv&&S.mode==='full'?`<div class="row" style="margin-top:10px"><button class="btn pri grow" id="nl">다음 단계로 →</button></div>`:''}
 ${wrongIds.length?`<h3 style="margin-top:28px">틀린 문제</h3><div class="card">${done.filter(x=>!x.res.ok).map(x=>wlHTML(x.q,x.input)).join('')}</div>`:''}`;
 const rw=$('#rw');if(rw)rw.onclick=()=>startQuiz('wrong',wrongIds);
 const rv=$('#revive');if(rv)rv.onclick=()=>{r.done=false;r.over=false;r.hearts=5;r.lost=0;r.pos++;renderRun(app);window.scrollTo(0,0)};
 $('#hub').onclick=()=>{run=null;render()};
 const nl=$('#nl');if(nl)nl.onclick=()=>startQuiz(nextLv);
}
function wlHTML(q,mine){
 const ans=q.type==='mc'?q.ans:q.type==='es'?q.model:q.type==='bl'?q.acc[0]:prettyAns(q);
 const qt=q.type==='bl'?q.q:q.q;
 return `<div class="wl"><div>${q.src?'<span class="badge">사료</span> ':''}${esc(qt)}</div>${mine?`<div class="a">내 답: ${esc(mine)}</div>`:''}<div class="a">정답: <b style="color:var(--fg)">${esc(ans)}</b></div></div>`;
}

/* ---------- essay mode ---------- */
function renderEssay(app){
 if(run&&run.kind==='quiz')return renderRun(app);
 const uids=selU();const n=qsOf(uids,['es']).length;const cnt=S.ecount||5;
 app.innerHTML=`<div class="steps"><button class="on">서술형</button><button data-go="wrong">오답노트${Object.keys(S.wrong).length?' '+Object.keys(S.wrong).length:''}</button><button data-go="world">월드</button></div><h2>서술형 풀기</h2><p class="sub">${rangeLabel()} · ${n}문항 · ${sample?'AI 채점':'키워드 채점'}</p>
 <div class="muted">문항 수</div><div class="cnt">${[5,10,0].map(k=>`<button class="${cnt===k?'on':''}" data-c="${k}">${k?k+'문항':'전체'}</button>`).join('')}</div>
 <div class="row" style="margin-top:18px"><button class="btn pri grow" id="go">시작하기</button></div>
 <h3 style="margin-top:26px">단원별 문항</h3><div class="card">${uids.map(uid=>`<div class="row" style="margin:4px 0"><span class="grow">${UM[uid].no}. ${UM[uid].short}</span><span class="muted">${UM[uid].es.length}문항 · ${S.stats[uid].rate==null?'-':S.stats[uid].rate+'%'}</span></div>`).join('')}</div>`;
 app.querySelectorAll('.cnt button').forEach(b=>b.onclick=()=>{S.ecount=+b.dataset.c;save();renderEssay(app)});
 $('#go').onclick=()=>startQuiz('es');
}

/* ---------- wrong note ---------- */
function renderWrong(app){
 if(run&&run.kind==='quiz')return renderRun(app);
 let ids=Object.keys(S.wrong).filter(id=>BANK[id]);
 if(S.mode==='essay')ids=ids.filter(id=>BANK[id].type==='es');
 const uids=selU();const inRange=ids.filter(id=>uids.includes(BANK[id].uid));
 if(!ids.length){app.innerHTML=`<h2>오답노트</h2><div class="empty">틀린 문제가 없어.</div>`;return}
 app.innerHTML=`<h2>오답노트</h2><p class="sub">다시 풀어서 맞히면 여기서 빠져.</p>
 <div class="row"><button class="btn pri grow" id="rt">틀린 문제만 다시 풀기 (${inRange.length})</button></div>
 ${inRange.length<ids.length?`<p class="muted">지금 범위 밖 오답 ${ids.length-inRange.length}개는 단원 고르기에서 범위를 넓히면 같이 풀 수 있어.</p>`:''}
 ${U.filter(u=>inRange.some(id=>BANK[id].uid===u.id)).map(u=>`<h3>${u.no}. ${u.short}</h3><div class="card">${inRange.filter(id=>BANK[id].uid===u.id).map(id=>wlHTML(BANK[id])).join('')}</div>`).join('')}`;
 $('#rt').onclick=()=>{if(inRange.length)startQuiz('wrong',shuffle(inRange))};
}

/* ---------- timeline ---------- */
function startTL(){
 const uids=selU();let ev=TIMELINE.filter(e=>uids.includes(e[3]));
 if(ev.length<4)ev=TIMELINE.slice();
 const pickN=Math.min(5,ev.length);let chosen=[];
 const sh=shuffle(ev);for(const e of sh){if(chosen.length>=pickN)break;if(chosen.some(c=>Math.floor(c[0]*100)===Math.floor(e[0]*100)))continue;chosen.push(e)}
 run={kind:'tl',items:shuffle(chosen),order:[],checked:false,score:run&&run.kind==='tl'?run.score:{c:0,t:0}};
 renderTL($('#app'));
}
function renderTL(app){
 const r=run;const correct=r.items.slice().sort((a,b)=>a[0]-b[0]);
 app.innerHTML=`<div class="qhead"><button class="btn sm" id="quit">그만</button><span class="grow"></span><span>맞힌 세트 ${r.score.c} / ${r.score.t}</span></div>
 <h2>연표 순서 맞추기</h2><p class="sub">먼저 일어난 사건부터 차례로 눌러. 다시 누르면 취소.</p>
 <div class="tl">${(r.checked?correct:r.items).map(e=>{const i=r.order.indexOf(e);let cls=i>=0?'picked':'';if(r.checked)cls+=r.order[correct.indexOf(e)]===e?' ok':' no';
  return `<button class="tli ${cls}" data-k="${e[0]}"><span class="o">${r.checked?correct.indexOf(e)+1:i>=0?i+1:''}</span><span>${esc(e[2])}</span>${r.checked?`<span class="d">${e[1]}</span>`:''}</button>`}).join('')}</div>
 ${r.checked?`<div class="fb ${r.ok?'ok':'no'}"><div class="v">${r.ok?'순서 완벽!':'순서가 달라.'}</div>위가 바른 순서야. ${r.ok?'':'빨간 칸이 내가 다르게 놓은 자리.'}</div>`:''}
 <div class="row end">${r.checked?'<button class="btn pri" id="nx">다음 세트 →</button>':`<button class="btn" id="rs">초기화</button><button class="btn pri" id="ck" ${r.order.length<r.items.length?'disabled':''}>확인</button>`}</div>`;
 $('#quit').onclick=()=>{run=null;render()};
 if(!r.checked)app.querySelectorAll('.tli').forEach(b=>b.onclick=()=>{const e=r.items.find(x=>String(x[0])===b.dataset.k);const i=r.order.indexOf(e);if(i>=0)r.order.splice(i,1);else r.order.push(e);renderTL(app)});
 const ck=$('#ck');if(ck)ck.onclick=()=>{r.checked=true;r.ok=r.order.every((e,i)=>e===correct[i]);r.score.t++;dq('act1');if(r.ok){r.score.c++;gainXP(20);award('tl');save()}renderTL(app)};
 const rs=$('#rs');if(rs)rs.onclick=()=>{r.order=[];renderTL(app)};
 const nx=$('#nx');if(nx)nx.onclick=startTL;
}

/* ---------- match ---------- */
function startMT(){
 const uids=selU();let pairs=[];uids.forEach(uid=>UM[uid].match.forEach(p=>pairs.push(p)));
 const prev=run&&run.kind==='mt'?run:null;
 let ch=[];for(const p of shuffle(pairs)){if(ch.length>=5)break;if(ch.some(c=>c[0]===p[0]||c[1]===p[1]))continue;ch.push(p)}
 run={kind:'mt',pairs:ch,L:shuffle(ch.map((p,i)=>({i,t:p[0]}))),R:shuffle(ch.map((p,i)=>({i,t:p[1]}))),done:{},pick:null,bad:null,miss:0,sets:prev?prev.sets:0,tmiss:prev?prev.tmiss:0};
 renderMT($('#app'));
}
function renderMT(app){
 const r=run;const fin=Object.keys(r.done).length===r.pairs.length;
 const cell=(side,x)=>`<button class="mi ${r.done[x.i]?'done':''} ${r.pick&&r.pick.s===side&&r.pick.i===x.i?'pick':''} ${r.bad&&r.bad.s===side&&r.bad.i===x.i?'bad':''}" data-s="${side}" data-i="${x.i}" ${r.done[x.i]?'disabled':''}>${esc(x.t)}</button>`;
 app.innerHTML=`<div class="qhead"><button class="btn sm" id="quit">그만</button><span class="grow"></span><span>완료 ${r.sets}세트</span></div>
 <h2>인물·단체 짝맞추기</h2><p class="sub">왼쪽을 누르고 맞는 오른쪽을 눌러. 틀린 횟수 ${r.miss}</p>
 <div class="mgrid">${r.L.map((x,k)=>cell('L',x)+cell('R',r.R[k])).join('')}</div>
 ${fin?`<div class="fb ${r.miss?'no':'ok'}"><div class="v">${r.miss?`다 맞췄어 (틀린 횟수 ${r.miss})`:'한 번에 다 맞혔어!'}</div>${r.pairs.map(p=>`${esc(p[0])} — ${esc(p[1])}`).join('<br>')}</div><div class="row end"><button class="btn pri" id="nx">다음 세트 →</button></div>`:''}`;
 $('#quit').onclick=()=>{run=null;render()};
 app.querySelectorAll('.mi').forEach(b=>b.onclick=()=>{
  const s=b.dataset.s,i=+b.dataset.i;r.bad=null;
  if(!r.pick||r.pick.s===s){r.pick={s,i};return renderMT(app)}
  if(r.pick.i===i){r.done[i]=1;r.pick=null;if(Object.keys(r.done).length===r.pairs.length){r.sets++;gainXP(15);dq('act1');if(!r.miss)award('mt');save()}}
  else{r.miss++;r.bad={s,i};r.pick=null}
  renderMT(app);
 });
 const nx=$('#nx');if(nx)nx.onclick=startMT;
}

/* ---------- misc ---------- */
function confirmSheet(msg,yes){
 const sh=$('#sheet');sh.innerHTML=`<div class="sheet"><div class="in"><div style="font-weight:700;font-size:18px;margin-bottom:16px">${esc(msg)}</div><div class="row"><button class="btn grow" id="cn">취소</button><button class="btn pri grow" id="cy">확인</button></div></div></div>`;
 $('#cn').onclick=()=>sh.innerHTML='';$('#cy').onclick=()=>{sh.innerHTML='';yes()};
 sh.querySelector('.sheet').onclick=e=>{if(e.target.classList.contains('sheet'))sh.innerHTML=''};
}
document.addEventListener('keydown',e=>{
 if(!run||run.kind!=='memo'||run.done)return;if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
 if(e.code==='Space'){e.preventDefault();run.flip=!run.flip;renderMemo($('#app'))}
 else if(e.key==='ArrowRight')memoMove(1);else if(e.key==='ArrowLeft')memoMove(-1);
});
render();
})();
</script>
</body>
